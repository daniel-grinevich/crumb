[project]
name = "crumb"
version = "0.1.0"
description = "ETL and analytics for the Navi platform: Temporal workers, Postgres warehouse, FastAPI"
authors = [
    { name = "daniel-grinevich", email = "kgbdannn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "stripe>=16.0.1",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
crumb = "crumb.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/crumb/sources/navi.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PL", "RUF", "SIM", "N"]
ignore = [
    "PLR0913", "PLR0915", "PLR0912", "PLR2004", "S311", "S101", "E501", "RUF012",
    "PLC0415", "S608", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004"]
"src/crumb/seed/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
exclude = ["src/crumb/sources/navi.py", "src/crumb/sources/stripe_source.py"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the compose warehouse Postgres on :5440"]
